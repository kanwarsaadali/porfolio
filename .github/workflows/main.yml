name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # Change to the branch you want to trigger deployment

env:
  SERVER_HOST: "40.90.162.68"
  SERVER_USER: "ubuntu"
  SERVER_PASSWORD: "vconn#vconn1"  # ⚠️ Store this in GitHub Secrets for security
  SSH_PORT: "1780"
  PROJECT_DIR: "/home/ubuntu/portfolio"  # ✅ Ensure this is the correct Git repo path
  APP_NAME: "portfolio"
  CONTAINER_NAME: "portfolio"
  APP_PORT: "3000"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            # Add the user to the docker group (fix permission issue)
            sudo usermod -aG docker $USER
            newgrp docker
            
            # Navigate to the correct project directory
            cd ${{ env.PROJECT_DIR }}

            # Ensure it's a valid git repository
            if [ ! -d ".git" ]; then
              echo "Error: Not a git repository!"
              exit 1
            fi
            
            # Pull latest changes
            git pull origin main

            # Build Docker Image
            sudo docker build -t ${{ env.APP_NAME }}:latest .

            # Stop and Remove Existing Container
            sudo docker stop ${{ env.CONTAINER_NAME }} || true
            sudo docker rm ${{ env.CONTAINER_NAME }} || true

            # Run New Container
            sudo docker run -d --name ${{ env.CONTAINER_NAME }} -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} ${{ env.APP_NAME }}:latest
